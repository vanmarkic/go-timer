<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #111;
      font-family: ui-monospace, "Courier New", monospace;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    #display {
      font-size: clamp(5rem, 20vw, 14rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #111;
    }

    #display.done { color: #16a34a; }

    .controls {
      display: flex;
      gap: 0.75rem;
    }

    button {
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      border: 1px solid #bbb;
      background: #fff;
      color: #333;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    button:hover { background: #e8e8e8; color: #000; }
    button:active { background: #d4d4d4; }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 32rem;
    }

    .presets button {
      min-width: 4.5rem;
    }

    .presets button.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }
  </style>
</head>
<body>
  <main>
    <div id="display" aria-live="polite">00:05:00</div>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="stop"  type="button">Stop</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <div class="presets" id="presets"></div>
  </main>

  <script>
    (() => {
      const PRESETS = [
        { label: 'S0',  ms: 5*60*1000 },
        { label: 'S1',  ms: (4*60+50)*1000 },
        { label: 'S2',  ms: (4*60+40)*1000 },
        { label: 'S3',  ms: (4*60+30)*1000 },
        { label: 'S4',  ms: (4*60+20)*1000 },
        { label: 'S5',  ms: (4*60+10)*1000 },
        { label: 'S6',  ms: 4*60*1000 },
        { label: 'S7',  ms: (3*60+50)*1000 },
        { label: 'S8',  ms: (3*60+30)*1000 },
        { label: 'S9',  ms: (3*60+10)*1000 },
        { label: 'S10', ms: 3*60*1000 },
      ];

      const display    = document.getElementById('display');
      const startBtn   = document.getElementById('start');
      const stopBtn    = document.getElementById('stop');
      const resetBtn   = document.getElementById('reset');
      const presetsDiv = document.getElementById('presets');

      let durationMs  = PRESETS[0].ms;
      let remainingMs = durationMs;
      let running     = false;
      let endTime     = 0;
      let intervalId  = null;
      let activePresetBtn = null;

      function pad(n) { return String(n).padStart(2, '0'); }

      function format(ms) {
        const s = Math.max(0, Math.ceil(ms / 1000));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return `${pad(h)}:${pad(m)}:${pad(sec)}`;
      }

      function render() {
        display.textContent = format(remainingMs);
        display.classList.toggle('done', remainingMs <= 0 && !running && durationMs > 0);
      }

      function stopTicker() {
        if (intervalId !== null) { clearInterval(intervalId); intervalId = null; }
      }

      function tick() {
        if (!running) return;
        remainingMs = Math.max(0, endTime - Date.now());
        render();
        if (remainingMs <= 0) { running = false; stopTicker(); }
      }

      function start() {
        if (running || remainingMs <= 0) return;
        running = true;
        endTime = Date.now() + remainingMs;
        stopTicker();
        tick();
        intervalId = setInterval(tick, 1000);
      }

      function stop() {
        if (!running) return;
        remainingMs = Math.max(0, endTime - Date.now());
        running = false;
        stopTicker();
        render();
      }

      function reset() {
        running = false;
        stopTicker();
        remainingMs = durationMs;
        render();
      }

      function applyPreset(ms, btn) {
        durationMs  = ms;
        running     = false;
        stopTicker();
        remainingMs = durationMs;
        render();
        if (activePresetBtn) activePresetBtn.classList.remove('active');
        btn.classList.add('active');
        activePresetBtn = btn;
      }

      PRESETS.forEach(({ label, ms }) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = label;
        btn.addEventListener('click', () => applyPreset(ms, btn));
        presetsDiv.appendChild(btn);
        if (ms === PRESETS[0].ms && !activePresetBtn) {
          btn.classList.add('active');
          activePresetBtn = btn;
        }
      });

      startBtn.addEventListener('click', start);
      stopBtn.addEventListener('click', stop);
      resetBtn.addEventListener('click', reset);

      render();
    })();
  </script>
</body>
</html>
