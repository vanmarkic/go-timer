name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check files present
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          echo "All static files present."
