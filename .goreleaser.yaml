version: 2

project_name: go-timer

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: go-timer
    main: ./
    binary: go-timer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  mode: replace
  name_template: 'go-timer {{.Version}}'
  footer: |
    ## Install

    Download the archive for your OS/arch from the assets below, extract it, and run the `go-timer` binary.

    Each archive is accompanied by an SPDX SBOM (`*.spdx.json`). All artifacts are listed in `checksums.txt` (SHA-256).
